<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e27">
<title>全球网络收音机</title>

<style>
:root{--bg:#0a0e27;--panel:#121736;--card:#1a2147;--card2:#222b55;--txt:#eef0fb;--sub:#9aa2c9;--acc:#5c7cff;--acc2:#8b5cff;--ok:#31c48d;--line:rgba(255,255,255,.08);--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#0a0e27,#0f1638 60%,#1a1240);color:var(--txt);min-height:100vh;padding-top:var(--safe-top);padding-bottom:calc(var(--safe-bot) + 90px);}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 30px;}
header.top{position:sticky;top:0;z-index:20;background:rgba(10,14,39,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px;}
.logo{width:36px;height:36px;border-radius:11px;flex:0 0 36px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;}
.logo .dot{width:10px;height:10px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.5);opacity:.4;}}
.radio-logo{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:linear-gradient(135deg,#5c7cff,#8b5cff);display:grid;place-items:center;position:relative;box-shadow:0 4px 14px rgba(92,124,255,.35);overflow:hidden;}
.radio-logo svg{width:100%;height:100%;display:block;}
.radio-logo .pulse-dot{position:absolute;right:4px;top:4px;width:8px;height:8px;border-radius:50%;background:#31c48d;box-shadow:0 0 0 2px rgba(49,196,141,.35);animation:pulse 1.6s infinite;}
.brand{min-width:0;flex:1;}
.brand h1{font-size:15px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand small{color:var(--sub);font-size:11px;}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--txt);width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:16px;cursor:pointer;padding:0;}
.search{position:sticky;top:56px;z-index:19;background:rgba(10,14,39,.95);padding:10px 0 6px;}
.searchbox{display:flex;gap:8px;}
.searchbox input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:13px;padding:11px 14px;font-size:15px;outline:none;}
.searchbox input:focus{border-color:var(--acc);}
.searchbox button{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#fff;border-radius:13px;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer;flex:0 0 auto;}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--sub);padding:7px 13px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap;}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;}
.sec-title{font-size:13px;color:var(--sub);margin:14px 4px 10px;display:flex;align-items:center;gap:8px;}
.sec-title .bar{width:4px;height:14px;border-radius:3px;background:linear-gradient(var(--acc),var(--acc2));}
.list{display:flex;flex-direction:column;gap:9px;}
.station{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;transition:.15s;}
.station:active{transform:scale(.985);}
.station.playing{border-color:var(--acc);background:var(--card2);box-shadow:0 0 0 1px rgba(92,124,255,.35);}
.favicon{width:44px;height:44px;border-radius:12px;background:var(--panel);display:grid;place-items:center;font-size:20px;flex:0 0 44px;overflow:hidden;}
.st-info{min-width:0;flex:1;}
.st-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st-meta{font-size:11px;color:var(--sub);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;}
.tag{background:rgba(92,124,255,.14);color:#b9c6ff;padding:1px 7px;border-radius:8px;font-size:10px;}
.st-play{width:42px;height:42px;border-radius:50%;flex:0 0 42px;background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#fff;display:grid;place-items:center;font-size:16px;cursor:pointer;padding:0;}
.station.playing .st-play{background:var(--ok);}
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,23,54,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 12px;padding-bottom:calc(10px + var(--safe-bot));transform:translateY(130%);transition:transform .35s cubic-bezier(.2,.9,.3,1);}
.player.show{transform:translateY(0);}
.player-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;}
.p-fav{width:40px;height:40px;border-radius:12px;background:var(--panel);display:grid;place-items:center;font-size:18px;cursor:pointer;flex:0 0 40px;border:none;color:var(--txt);}
.p-info{min-width:0;flex:1;}
.p-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-meta{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-ctrl{display:flex;gap:6px;align-items:center;}
.p-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);display:grid;place-items:center;font-size:16px;cursor:pointer;padding:0;}
.p-btn.play{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;width:48px;height:48px;}
.empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:14px;}
.empty .retry{display:inline-block;margin-top:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#fff;border-radius:12px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-bot));transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.88);color:#fff;font-size:13px;padding:10px 18px;border-radius:22px;z-index:99;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:calc(100vw - 40px);overflow:hidden;text-overflow:ellipsis;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media (max-width:360px){.brand h1{font-size:14px;}.iconbtn{width:34px;height:34px;}.radio-logo{width:36px;height:36px;flex:0 0 36px;}.favicon{width:40px;height:40px;flex:0 0 40px;}.st-play{width:38px;height:38px;flex:0 0 38px;font-size:15px;}.p-btn{width:38px;height:38px;}.p-btn.play{width:44px;height:44px;}.p-fav{width:38px;height:38px;flex:0 0 38px;}}
@media (max-width:330px){.p-ctrl .p-btn:not(.play){display:none;}}
</style>
</head>

<script>
/* =====================================================
   网络增强：多节点 + 超时 + 重试 + 竞速 + 缓存
   ===================================================== */
var API_HOSTS = [
  "https://all.api.radio-browser.info",
  "https://de1.api.radio-browser.info",
  "https://at1.api.radio-browser.info",
  "https://nl1.api.radio-browser.info",
  "https://fi1.api.radio-browser.info"
];
var apiHost = null;
try{
  var cachedHost = localStorage.getItem("radio_api_host");
  if(cachedHost){ apiHost = cachedHost; }
}catch(e){}

var state = {
  list: [],
  playing: null,
  favorites: loadFav(),
  category: "top",
  query: "",
  loading: false,
  unlocked: false,
  retrying: false
};

var listEl = document.getElementById("list");
var chipsEl = document.getElementById("chips");
var toastEl = document.getElementById("toast");
var qEl = document.getElementById("q");
var listTitleEl = document.getElementById("listTitle");
var playerEl = document.getElementById("player");
var brandSub = document.getElementById("brandSub");

var audio = document.getElementById("audioEl");
var hls = null;

audio.addEventListener("playing", function(){ renderList(); renderPlayer(); });
audio.addEventListener("pause",   function(){ renderList(); renderPlayer(); });
audio.addEventListener("waiting", function(){ brandSub.textContent = "缓冲中…"; });
audio.addEventListener("playing", function(){ brandSub.textContent = "正在播放"; });
audio.addEventListener("error", function(){
  if(hls) return;
  toast("播放失败，换一个试试");
  renderList(); renderPlayer();
});

function isHls(url){
  return /\.m3u8(\?|$)/i.test(url);
}

/* HLS：加大缓冲 + 网络错误自动恢复 */
function setAudioSource(url){
  if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }
  audio.removeAttribute("src");
  audio.load();

  if(isHls(url)){
    if(window.Hls && window.Hls.isSupported()){
      hls = new window.Hls({
        lowLatencyMode: false,
        enableWorker: true,
        maxBufferLength: 60,
        maxMaxBufferLength: 180,
        maxBufferSize: 180 * 1000 * 1000,
        maxBufferHole: 1.0,
        manifestLoadingTimeOut: 30000,
        manifestLoadingMaxRetry: 6,
        levelLoadingTimeOut: 30000,
        levelLoadingMaxRetry: 6,
        fragLoadingTimeOut: 30000,
        fragLoadingMaxRetry: 8,
        liveSyncDurationCount: 3,
        liveMaxLatencyDurationCount: 12,
        liveDurationInfinity: true
      });
      hls.loadSource(url);
      hls.attachMedia(audio);
      hls.on(window.Hls.Events.ERROR, function(evt, data){
        if(!data || !data.fatal) return;
        if(data.type === window.Hls.ErrorTypes.NETWORK_ERROR){
          try{ hls.startLoad(); }catch(e){}
        }else if(data.type === window.Hls.ErrorTypes.MEDIA_ERROR){
          try{ hls.recoverMediaError(); }catch(e){}
        }else{
          toast("该电台暂无法播放");
        }
      });
      return true;
    }
    if(audio.canPlayType("application/vnd.apple.mpegurl")){
      audio.src = url;
      return true;
    }
    toast("当前浏览器不支持该电台格式");
    return false;
  }
  audio.src = url;
  return true;
}

function unlockAudio(){
  if(state.unlocked) return;
  state.unlocked = true;
  try{
    var silent = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
    var a = new Audio(silent);
    a.muted = true;
    var p = a.play();
    if(p && p["catch"]) p["catch"](function(){});
    audio.muted = true;
    var p2 = audio.play();
    if(p2 && p2["catch"]) p2["catch"](function(){});
    setTimeout(function(){ audio.muted = false; }, 50);
  }catch(e){}
}

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(function(){ toastEl.classList.remove("show"); }, 2000);
}
function loadFav(){
  try{ return JSON.parse(localStorage.getItem("radio_fav_v5") || "[]"); }catch(e){ return []; }
}
function saveFav(){
  try{ localStorage.setItem("radio_fav_v5", JSON.stringify(state.favorites)); }catch(e){}
}
function isFav(st){
  for(var i=0;i<state.favorites.length;i++){
    if(state.favorites[i].stationuuid === st.stationuuid) return true;
  }
  return false;
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function fetchWithTimeout(url, ms){
  return new Promise(function(resolve, reject){
    var ctrl = ("AbortController" in window) ? new AbortController() : null;
    var done = false;
    var timer = setTimeout(function(){
      if(done) return;
      done = true;
      if(ctrl) try{ ctrl.abort(); }catch(e){}
      reject(new Error("timeout"));
    }, ms);
    var opt = { method:"GET", cache:"no-store" };
    if(ctrl) opt.signal = ctrl.signal;
    fetch(url, opt).then(function(r){
      if(done) return;
      done = true;
      clearTimeout(timer);
      if(!r.ok){ reject(new Error("HTTP " + r.status)); return; }
      resolve(r);
    })["catch"](function(e){
      if(done) return;
      done = true;
      clearTimeout(timer);
      reject(e);
    });
  });
}

function fetchRetry(url, ms, retries){
  retries = retries || 2;
  var attempt = 0;
  var delays = [300, 800];
  function tryOnce(){
    return fetchWithTimeout(url, ms)["catch"](function(err){
      attempt++;
      if(attempt >= retries) throw err;
      return new Promise(function(res){
        setTimeout(res, delays[Math.min(attempt-1, delays.length-1)]);
      }).then(tryOnce);
    });
  }
  return tryOnce();
}

function raceHosts(path, ms){
  return new Promise(function(resolve, reject){
    var done = false;
    var errors = 0;
    for(var i=0;i<API_HOSTS.length;i++){
      (function(host){
        fetchWithTimeout(host + path, ms)
          .then(function(r){ return r.json(); })
          .then(function(data){
            if(done) return;
            done = true;
            apiHost = host;
            try{ localStorage.setItem("radio_api_host", host); }catch(e){}
            resolve({ host: host, data: data });
          })
          ["catch"](function(e){
            errors++;
            if(!done && errors >= API_HOSTS.length){
              done = true;
              reject(e);
            }
          });
      })(API_HOSTS[i]);
    }
  });
}

function findApiHost(callback){
  if(apiHost){
    fetchWithTimeout(apiHost + "/json/stats", 4000)
      .then(function(r){ return r.json(); })
      .then(function(){ callback(apiHost); })
      ["catch"](function(){
        apiHost = null;
        try{ localStorage.removeItem("radio_api_host"); }catch(e){}
        raceHosts("/json/stats", 5000).then(function(res){
          callback(res.host);
        })["catch"](function(){
          callback(null);
        });
      });
    return;
  }
  brandSub.textContent = "正在连接电台库…";
  raceHosts("/json/stats", 5000).then(function(res){
    callback(res.host);
  })["catch"](function(){
    callback(null);
  });
}

function cnCountry(s){
  if(!s) return "";
  var k = String(s).trim().toLowerCase();
  return CN_COUNTRY[k] || s;
}
function cnLang(s){
  if(!s) return "";
  var k = String(s).trim().toLowerCase();
  return CN_LANG[k] || s;
}
function cnTag(s){
  if(!s) return "";
  var k = String(s).trim().toLowerCase();
  return CN_TAG[k] || s;
}
function cnStationName(name){
  if(!name) return "";
  var n = String(name).trim();
  var key = n.toLowerCase();
  if(CN_STATION_NAME[key]) return CN_STATION_NAME[key];
  for(var k in CN_STATION_NAME){
    if(key.indexOf(k) === 0) return CN_STATION_NAME[k];
  }
  for(var k2 in CN_STATION_NAME){
    if(key.indexOf(k2) > -1) return CN_STATION_NAME[k2];
  }
  return n;
}

/* =====================================================
   搜索逻辑：直接用 name=关键词（恢复原样）
   ===================================================== */
function buildUrl(host){
  var base = host || apiHost || API_HOSTS[0];

  if(state.query){
    return base + "/json/stations/search?name=" + encodeURIComponent(state.query)
         + "&limit=100&hidebroken=true&order=votes&reverse=true";
  }
  if(state.category === "fav") return null;
  if(state.category === "chinese")
    return base + "/json/stations/search?language=chinese&limit=100&hidebroken=true&order=votes&reverse=true";
  if(state.category === "english")
    return base + "/json/stations/search?language=english&limit=100&hidebroken=true&order=votes&reverse=true";

  var tagMap = { music:"music", news:"news", talk:"talk", jazz:"jazz", rock:"rock", electronic:"electronic", classical:"classical" };
  if(tagMap[state.category])
    return base + "/json/stations/search?tag=" + tagMap[state.category] + "&limit=100&hidebroken=true&order=votes&reverse=true";

  return base + "/json/stations/topvote/100";
}

function fetchStationsWithHost(host){
  var url = buildUrl(host);
  if(!url) return Promise.reject(new Error("no url"));
  return fetchRetry(url, 8000, 2).then(function(r){ return r.json(); });
}

function applyResult(data){
  var arr = Array.isArray(data) ? data : [];
  arr = arr.filter(function(s){ return s.url_resolved || s.url; });
  state.list = arr;
  state.loading = false;
  renderList();
  updateListTitle();
  brandSub.textContent = "共 " + arr.length + " 个电台";
}

function loadStations(){
  if(state.category === "fav"){
    state.list = state.favorites.slice();
    renderList();
    updateListTitle();
    return;
  }
  state.loading = true;
  renderList();

  fetchStationsWithHost(apiHost)
    .then(function(data){ applyResult(data); })
    ["catch"](function(e){
      if(!state.retrying){
        state.retrying = true;
        brandSub.textContent = "网络重连中…";
        apiHost = null;
        try{ localStorage.removeItem("radio_api_host"); }catch(e2){}
        raceHosts("/json/stats", 5000).then(function(res){
          state.retrying = false;
          if(!res || !res.host){ showLoadError(e); return; }
          fetchStationsWithHost(res.host).then(applyResult)["catch"](function(e3){
            state.retrying = false;
            showLoadError(e3);
          });
        })["catch"](function(){
          state.retrying = false;
          showLoadError(e);
        });
      }else{
        state.retrying = false;
        showLoadError(e);
      }
    });
}

function showLoadError(e){
  state.loading = false;
  state.list = [];
  listEl.innerHTML = '<div class="empty">加载失败：' + esc(e && e.message ? e.message : "网络异常")
    + '<br><br>当前网络可能无法访问电台库服务器'
    + '<br>请切换网络后重试'
    + '<br><button class="retry" id="btnRetry">重新加载</button></div>';
  brandSub.textContent = "连接失败";
  var rb = document.getElementById("btnRetry");
  if(rb) rb.addEventListener("click", function(){
    apiHost = null;
    try{ localStorage.removeItem("radio_api_host"); }catch(e2){}
    findApiHost(function(host){
      if(!host){ toast("仍无法连接，请切换网络"); return; }
      loadStations();
    });
  });
}

/* ========== 渲染 ========== */
var CATS = [
  {key:"top",t:"热门"},
  {key:"chinese",t:"中文"},
  {key:"english",t:"英语"},
  {key:"music",t:"音乐"},
  {key:"news",t:"新闻"},
  {key:"talk",t:"谈话"},
  {key:"jazz",t:"爵士"},
  {key:"rock",t:"摇滚"},
  {key:"electronic",t:"电子"},
  {key:"classical",t:"古典"},
  {key:"fav",t:"★ 收藏"}
];

function renderChips(){
  var html = "";
  for(var i=0;i<CATS.length;i++){
    var c = CATS[i];
    html += '<div class="chip'+(state.category===c.key?' on':'')+'" data-key="'+c.key+'">'+c.t+'</div>';
  }
  chipsEl.innerHTML = html;
}

function renderList(){
  if(state.loading){
    listEl.innerHTML = '<div class="empty">正在加载电台…</div>';
    return;
  }
  if(!state.list.length){
    listEl.innerHTML = '<div class="empty">没有找到相关电台<br>试试其它关键词～</div>';
    return;
  }
  var html = "";
  for(var i=0;i<state.list.length;i++){
    var st = state.list[i];
    var playing = state.playing && state.playing.stationuuid === st.stationuuid;
    var fav = isFav(st);

    var displayName = cnStationName(st.name);
    var country = cnCountry(st.country);
    var lang = cnLang(st.language);

    var rawTags = st.tags ? String(st.tags).split(",") : [];
    var tags = [];
    for(var j=0;j<rawTags.length && tags.length<2;j++){
      var t = rawTags[j].trim();
      if(t) tags.push(cnTag(t));
    }
    var tagHtml = "";
    for(var k=0;k<tags.length;k++){
      tagHtml += '<span class="tag">'+esc(tags[k])+'</span>';
    }

    var icon = st.favicon
      ? '<img src="'+esc(st.favicon)+'" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display=\'none\';this.parentNode.textContent=\'📻\';">'
      : "📻";

    html += '<div class="station'+(playing?' playing':'')+'" data-uuid="'+esc(st.stationuuid)+'">'
         +    '<div class="favicon">'+icon+'</div>'
         +    '<div class="st-info">'
         +      '<div class="st-name">'+esc(displayName)+'</div>'
         +      '<div class="st-meta">'
         +        (country?'<span class="tag">'+esc(country)+'</span>':'')
         +        (lang?'<span class="tag">'+esc(lang)+'</span>':'')
         +        tagHtml
         +        (fav?'<span class="tag">★</span>':'')
         +      '</div>'
         +    '</div>'
         +    '<button class="st-play" type="button" data-play="'+esc(st.stationuuid)+'">'+(playing?'⏸':'▶')+'</button>'
         +  '</div>';
  }
  listEl.innerHTML = html;
}

function renderPlayer(){
  var st = state.playing;
  if(!st){ playerEl.classList.remove("show"); return; }
  playerEl.classList.add("show");
  document.getElementById("pName").textContent = cnStationName(st.name) || "未命名电台";
  document.getElementById("pMeta").textContent =
    [cnCountry(st.country), cnLang(st.language)].filter(Boolean).join(" · ") || "在线电台";
  document.getElementById("pFav").textContent = isFav(st) ? "★" : "♪";
  document.getElementById("pPlay").textContent = (!audio.paused) ? "⏸" : "▶";
}

function updateListTitle(){
  if(state.query) listTitleEl.textContent = '搜索："' + state.query + '"';
  else if(state.category === "fav") listTitleEl.textContent = "我的收藏";
  else{
    for(var i=0;i<CATS.length;i++){
      if(CATS[i].key === state.category){ listTitleEl.textContent = CATS[i].t + "电台"; return; }
    }
    listTitleEl.textContent = "热门电台";
  }
}

function playStation(st){
  if(!st) return;
  var url = st.url_resolved || st.url;
  if(!url){ toast("该电台暂无播放地址"); return; }
  state.playing = st;

  var ok = setAudioSource(url);
  if(!ok){ state.playing = null; renderPlayer(); return; }

  var p = audio.play();
  if(p && p["catch"]){
    p["catch"](function(err){
      if(err && (err.name === "NotAllowedError" || /gesture|interact/i.test(err.message||""))){
        toast("请再点一次 ▶");
      }else{
        toast("该电台暂无法播放");
      }
    });
  }
  renderList();
  renderPlayer();
}

function togglePlay(){
  if(!state.playing){ if(state.list[0]) playStation(state.list[0]); return; }
  if(audio.paused){
    var p = audio.play();
    if(p && p["catch"]) p["catch"](function(){});
  }else audio.pause();
}

function nextStation(dir){
  if(!state.list.length) return;
  var i = 0;
  for(var k=0;k<state.list.length;k++){
    if(state.playing && state.list[k].stationuuid === state.playing.stationuuid){ i = k; break; }
  }
  i = (i + dir + state.list.length) % state.list.length;
  playStation(state.list[i]);
}

function toggleFav(st){
  var idx = -1;
  for(var i=0;i<state.favorites.length;i++){
    if(state.favorites[i].stationuuid === st.stationuuid){ idx = i; break; }
  }
  if(idx >= 0){ state.favorites.splice(idx, 1); toast("已取消收藏"); }
  else{ state.favorites.unshift(st); toast("已收藏 ★"); }
  saveFav();
  if(state.category === "fav"){ state.list = state.favorites.slice(); }
  renderList(); renderPlayer();
}

chipsEl.addEventListener("click", function(e){
  unlockAudio();
  var el = e.target.closest ? e.target.closest(".chip") : null;
  if(!el) return;
  state.category = el.getAttribute("data-key");
  state.query = "";
  qEl.value = "";
  renderChips();
  loadStations();
});

document.getElementById("btnSearch").addEventListener("click", function(){
  unlockAudio();
  state.query = qEl.value.trim();
  if(state.query){ state.category = ""; renderChips(); }
  loadStations();
});

qEl.addEventListener("keydown", function(e){
  if(e.key === "Enter" || e.keyCode === 13){
    e.preventDefault();
    document.getElementById("btnSearch").click();
  }
});

listEl.addEventListener("click", function(e){
  unlockAudio();

  var btn = e.target.closest ? e.target.closest("[data-play]") : null;
  var card = e.target.closest ? e.target.closest(".station") : null;
  var id = btn ? btn.getAttribute("data-play") : (card ? card.getAttribute("data-uuid") : null);
  if(!id) return;
  var st = null;
  for(var i=0;i<state.list.length;i++){
    if(state.list[i].stationuuid === id){ st = state.list[i]; break; }
  }
  if(!st) return;
  if(state.playing && state.playing.stationuuid === st.stationuuid){ togglePlay(); }
  else{ playStation(st); }
});

document.getElementById("pPlay").addEventListener("click", function(){ unlockAudio(); togglePlay(); });
document.getElementById("pPrev").addEventListener("click", function(){ unlockAudio(); nextStation(-1); });
document.getElementById("pNext").addEventListener("click", function(){ unlockAudio(); nextStation(1); });
document.getElementById("pFav").addEventListener("click", function(){
  if(!state.playing){ toast("先播放一个电台"); return; }
  toggleFav(state.playing);
});

document.getElementById("btnFav").addEventListener("click", function(){
  state.category = "fav";
  state.query = "";
  qEl.value = "";
  renderChips();
  loadStations();
});

document.getElementById("btnTop").addEventListener("click", function(){
  window.scrollTo({top:0, behavior:"smooth"});
});

renderChips();
renderList();
updateListTitle();
renderPlayer();

findApiHost(function(host){
  if(!host){
    listEl.innerHTML = '<div class="empty">无法连接到全球电台库<br><br>请检查网络，或切换网络后重试</div>';
    brandSub.textContent = "连接失败";
    return;
  }
  brandSub.textContent = "已连接 · 点 ▶ 收听";
  loadStations();
});
